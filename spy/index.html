<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070a">
<title>GHOSTLINE // UMBRA-7</title>
<style>
:root{
  --bg:#05070a; --bg2:#0a0e14; --glass:rgba(16,22,32,.72); --line:rgba(0,230,195,.18);
  --teal:#00e6c3; --cyan:#35c7ff; --amber:#ffb347; --red:#ff3b4e; --grn:#7dff9a;
  --txt:#d9e2ec; --mut:#7c8794; --dim:#4a545e;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Helvetica,Arial,sans-serif;
  color:var(--txt); font-weight:300; letter-spacing:.02em;
  position:fixed; inset:0; width:100%; touch-action:manipulation; user-select:none; -webkit-user-select:none;
}
.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
button{font-family:inherit;touch-action:manipulation}
/* ---------- vignette + grain overlays ---------- */
#vignette{position:fixed;inset:0;pointer-events:none;z-index:9000;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#nvTint{position:fixed;inset:0;pointer-events:none;z-index:8999;opacity:0;transition:opacity .5s;
  background:rgba(20,255,120,.10);mix-blend-mode:screen}
body.nv #nvTint{opacity:1}
body.nv{--teal:#7dff9a;--cyan:#a8ffc0;--line:rgba(125,255,154,.22)}
/* ---------- BOOT ---------- */
#boot{position:fixed;inset:0;background:#000;z-index:10000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px;gap:18px}
#boot .logo{font-size:26px;letter-spacing:.55em;font-weight:200;color:var(--teal);
  text-shadow:0 0 24px rgba(0,230,195,.6)}
#boot .sub{font-size:11px;letter-spacing:.4em;color:var(--mut)}
#bootLog{width:100%;max-width:330px;height:170px;overflow:hidden;font-size:11px;line-height:1.7;
  color:#8fa3b3;opacity:0;transition:opacity .6s}
#bootLog .ok{color:var(--teal)} #bootLog .warn{color:var(--amber)}
#initBtn{opacity:0;pointer-events:none;transition:opacity .8s;margin-top:6px;
  border:1px solid var(--teal);background:rgba(0,230,195,.08);color:var(--teal);
  padding:18px 44px;font-size:15px;letter-spacing:.35em;font-weight:400;min-height:60px;
  animation:pulseB 2s infinite}
#initBtn.ready{opacity:1;pointer-events:auto}
@keyframes pulseB{0%,100%{box-shadow:0 0 0 rgba(0,230,195,.0)}50%{box-shadow:0 0 28px rgba(0,230,195,.45)}}
/* ---------- AUTH ---------- */
#auth{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#0b1119,#020304 70%);
  z-index:9900;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px}
#auth h2{font-size:13px;letter-spacing:.45em;color:var(--mut);font-weight:400}
#printWrap{position:relative;width:190px;height:190px;margin:10px 0}
#printRing{position:absolute;inset:0;transform:rotate(-90deg)}
#printRing circle.bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:3}
#printRing circle.fg{fill:none;stroke:var(--teal);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:565;stroke-dashoffset:565}
#printSVG{position:absolute;inset:22px;opacity:.85}
#scanline{position:absolute;left:14px;right:14px;height:2px;background:var(--teal);
  box-shadow:0 0 14px var(--teal);top:10%;opacity:0}
#authMsg{font-size:12px;letter-spacing:.25em;color:var(--teal);min-height:20px;text-align:center}
#authHint{font-size:11px;color:var(--dim);letter-spacing:.15em;text-align:center;line-height:1.8}
/* ---------- APP SHELL ---------- */
#app{display:none;position:fixed;inset:0;flex-direction:column;
  padding:var(--sat) var(--sar) 0 var(--sal);background:
  linear-gradient(rgba(45,226,214,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(45,226,214,.05) 1px,transparent 1px),
  radial-gradient(1200px 600px at 80% -10%,rgba(0,230,195,.06),transparent),
  radial-gradient(900px 500px at 10% 110%,rgba(53,199,255,.05),transparent),var(--bg);
  background-size:24px 24px,24px 24px,auto,auto,auto}
#hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px}
#hdr .brand{font-size:13px;letter-spacing:.4em;color:var(--teal);font-weight:400}
#hdr .brand small{display:block;font-size:8px;letter-spacing:.32em;color:var(--mut);margin-top:2px}
#hdrRight{display:flex;align-items:center;gap:10px}
#clock{font-size:11px;color:var(--mut);letter-spacing:.15em}
.iconBtn{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--glass);
  color:var(--teal);font-size:17px;display:flex;align-items:center;justify-content:center}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 14px 14px;-webkit-overflow-scrolling:touch}
.tab{display:none;animation:tabIn .28s ease}
.tab.active{display:block}
@keyframes tabIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#tabbar{display:flex;overflow-x:auto;gap:6px;padding:8px 10px calc(10px + var(--sab));
  border-top:1px solid var(--line);background:rgba(5,8,12,.92);-webkit-overflow-scrolling:touch}
#tabbar::-webkit-scrollbar{display:none}
.ttab{flex:0 0 auto;min-width:64px;min-height:52px;border:1px solid transparent;border-radius:12px;
  background:transparent;color:var(--mut);font-size:10px;letter-spacing:.18em;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 10px}
.ttab .ic{font-size:18px}
.ttab.active{color:var(--teal);border-color:var(--line);background:rgba(0,230,195,.07)}
.ttab.danger.active{color:var(--red);border-color:rgba(255,59,78,.35);background:rgba(255,59,78,.08)}
/* ---------- shared components ---------- */
.panel{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px;
  margin-bottom:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ptitle{font-size:10px;letter-spacing:.32em;color:var(--teal);margin-bottom:10px;font-weight:500}
.btn{display:block;width:100%;min-height:52px;border:1px solid var(--line);border-radius:12px;
  background:rgba(0,230,195,.06);color:var(--txt);font-size:13px;letter-spacing:.2em;
  margin:8px 0;transition:transform .08s}
.btn:active{transform:scale(.97);background:rgba(0,230,195,.14)}
.btn.teal{background:rgba(0,230,195,.14);color:var(--teal);border-color:rgba(0,230,195,.4)}
.btn.red{border-color:rgba(255,59,78,.5);color:var(--red);background:rgba(255,59,78,.08)}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;font-size:11px}
.row{display:flex;gap:8px}.row .btn{margin:4px 0}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.kv:last-child{border-bottom:none}
.kv b{color:var(--teal);font-weight:500}
.kv span{color:var(--mut)}
.bar{height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan));
  border-radius:3px;transition:width .5s}
.chip{display:inline-block;padding:10px 14px;margin:4px;border:1px solid var(--line);border-radius:20px;
  font-size:12px;color:var(--teal);background:rgba(0,230,195,.06);min-height:44px}
.chip:active{background:rgba(0,230,195,.2)}
/* ---------- dossier ---------- */
#agentCard{text-align:center;padding:20px 14px}
#codenameBig{font-size:30px;letter-spacing:.3em;color:var(--txt);font-weight:200;margin:8px 0 2px}
#clearLvl{font-size:11px;letter-spacing:.35em;color:var(--amber)}
#agentSigil{width:84px;height:84px;margin:0 auto;border:1px solid var(--line);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:34px;
  box-shadow:0 0 30px rgba(0,230,195,.15) inset}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;
  padding:12px;text-align:center}
.stat .n{font-size:24px;color:var(--teal);font-weight:300}
.stat .l{font-size:9px;letter-spacing:.25em;color:var(--mut);margin-top:4px}
/* ---------- comms ---------- */
.msg{border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:12px;margin-bottom:10px;
  background:rgba(255,255,255,.02)}
.msg .mh{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;
  color:var(--mut);margin-bottom:8px}
.msg.unread{border-color:rgba(0,230,195,.35)}
.msg .body{font-size:13px;line-height:1.6;min-height:44px;word-break:break-word}
.msg.unread .body{color:var(--teal)}
.badge{font-size:9px;letter-spacing:.2em;padding:3px 8px;border-radius:8px;border:1px solid var(--line);
  color:var(--teal)}
.badge.new{background:var(--teal);color:#000;font-weight:600}
#replyZone{margin-top:6px}
.sent{border-color:rgba(53,199,255,.3)} .sent .body{color:var(--cyan)}
/* ---------- surveillance ---------- */
.feedWrap{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  margin-bottom:12px;background:#000}
.feedWrap canvas{display:block;width:100%;height:150px}
.feedTag{position:absolute;top:8px;left:10px;font-size:10px;letter-spacing:.25em;color:#fff;
  background:rgba(0,0,0,.55);padding:4px 8px;border-radius:6px}
.feedTag .rec{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff3b4e;
  margin-right:6px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.feedTag.locked{color:var(--red)}
.feedTag .live{color:#ff5b6a;font-size:9px;letter-spacing:.2em}
/* corner brackets — the "this is live" mark (brief §4) */
.cb{position:absolute;width:14px;height:14px;border:2px solid rgba(0,230,195,.85);
  pointer-events:none;z-index:5}
.cb.tl{top:6px;left:6px;border-right:0;border-bottom:0;border-top-left-radius:4px}
.cb.tr{top:6px;right:6px;border-left:0;border-bottom:0;border-top-right-radius:4px}
.cb.bl{bottom:6px;left:6px;border-right:0;border-top:0;border-bottom-left-radius:4px}
.cb.br{bottom:6px;right:6px;border-left:0;border-top:0;border-bottom-right-radius:4px}
/* radar sweep on the tracker map — 4s/rev (brief §4) */
#sweep{position:absolute;inset:0;pointer-events:none;border-radius:12px;
  background:conic-gradient(from 0deg at 50% 50%,rgba(0,230,195,.30),transparent 18%);
  animation:sweep 4s linear infinite}
#sweepCore{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;
  border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);pointer-events:none}
@keyframes sweep{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){#sweep{animation:none}}
body.nightvis .feedWrap canvas{filter:saturate(.4) hue-rotate(80deg) brightness(1.1) contrast(1.25)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0}
.seg button{flex:1;min-height:48px;background:transparent;border:none;color:var(--mut);
  font-size:11px;letter-spacing:.2em}
.seg button.on{background:rgba(0,230,195,.15);color:var(--teal)}
/* ---------- map ---------- */
#mapSVG{width:100%;height:340px;display:block;background:#04060a;border-radius:12px;
  border:1px solid var(--line)}
.blip{cursor:pointer}
/* ---------- terminal ---------- */
#termOut{height:300px;overflow-y:auto;font-size:12px;line-height:1.65;padding:4px 2px}
#termOut .p{color:var(--teal)} #termOut .e{color:var(--red)} #termOut .d{color:var(--dim)}
#termOut .w{color:var(--amber)} #termOut .c{color:var(--cyan)}
#termRow{display:flex;gap:8px;margin-top:8px}
#termIn{flex:1;min-height:48px;background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:10px;
  color:var(--teal);padding:0 12px;font-size:14px}
#termIn:focus{outline:none;border-color:var(--teal)}
#codePads{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.pad{min-height:72px;border-radius:12px;border:1px solid var(--line);font-size:11px;
  letter-spacing:.25em;color:var(--txt);background:rgba(255,255,255,.03)}
.pad.lit{background:var(--teal);color:#000;box-shadow:0 0 26px var(--teal)}
/* ---------- laser minigame ---------- */
#laserCv{width:100%;height:260px;display:block;background:#04060a;border-radius:12px;
  border:1px solid var(--line);touch-action:none}
/* ---------- missions ---------- */
.mission{border-left:3px solid var(--dim)}
.mission.done{border-left-color:var(--grn);opacity:.75}
.obj{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.05)}
.obj:last-child{border:none}
.obj .box{width:22px;height:22px;border:1px solid var(--dim);border-radius:6px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--grn)}
.obj.hit .box{border-color:var(--grn);background:rgba(125,255,154,.1)}
.obj.hit{color:var(--mut);text-decoration:line-through}
/* ---------- self destruct ---------- */
#killPane{text-align:center;padding:26px 14px}
#killBtn{width:190px;height:190px;border-radius:50%;margin:18px auto;border:3px solid var(--red);
  background:radial-gradient(circle,rgba(255,59,78,.22),rgba(255,59,78,.04));
  color:var(--red);font-size:15px;letter-spacing:.25em;position:relative;overflow:hidden}
#killBtn:active{transform:scale(.98)}
#killRing{position:absolute;inset:-3px;transform:rotate(-90deg)}
#killRing circle{fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round;
  stroke-dasharray:584;stroke-dashoffset:584}
#sdOverlay{position:fixed;inset:0;background:#000;z-index:9800;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center}
#sdOverlay.alarm{background:#1a0205;animation:alarmBg .8s infinite}
@keyframes alarmBg{50%{background:#3a050c}}
#sdCount{font-size:96px;font-weight:100;color:var(--red);letter-spacing:.05em}
/* ---------- emp / reboot ---------- */
#flash{position:fixed;inset:0;background:#fff;z-index:9700;opacity:0;pointer-events:none}
#reboot{position:fixed;inset:0;background:#000;z-index:9750;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:40px}
#reboot .bar{width:min(300px,80%)}
/* ---------- toasts ---------- */
#toasts{position:fixed;top:calc(var(--sat) + 64px);left:14px;right:14px;z-index:9400;
  display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:rgba(10,16,24,.94);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;font-size:12px;display:flex;gap:10px;align-items:center;
  animation:tabIn .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast .x{margin-left:auto;color:var(--dim);font-size:16px;padding:6px;min-width:44px;min-height:44px;
  display:flex;align-items:center;justify-content:center}
.toast b{color:var(--teal);font-weight:500;letter-spacing:.1em}
.big{font-size:15px!important}
.hint{font-size:11px;color:var(--dim);letter-spacing:.12em;line-height:1.7;margin-top:6px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="vignette"></div><div id="nvTint"></div>

<!-- BOOT -->
<div id="boot">
  <div class="logo">GHOSTLINE</div>
  <div class="sub">UMBRA-7 FIELD KIT</div>
  <div id="bootLog" class="mono"></div>
  <div class="hint" id="bootSkip" style="text-align:center">TAP ANYWHERE TO SKIP</div>
  <button id="initBtn">TAP TO INITIALIZE</button>
</div>

<!-- AUTH -->
<div id="auth">
  <h2>BIOMETRIC VERIFICATION</h2>
  <div id="printWrap">
    <svg id="printRing" viewBox="0 0 190 190">
      <circle class="bg" cx="95" cy="95" r="90"/>
      <circle class="fg" id="ringFg" cx="95" cy="95" r="90"/>
    </svg>
    <svg id="printSVG" viewBox="0 0 146 146"></svg>
    <div id="scanline"></div>
  </div>
  <div id="authMsg">PRESS &amp; HOLD TO SCAN</div>
  <div id="authHint">PLACE FINGER ON THE SENSOR<br>AND HOLD UNTIL THE RING COMPLETES</div>
</div>

<!-- APP -->
<div id="app">
  <div id="hdr">
    <div class="brand">GHOSTLINE<small>UMBRA-7 // FIELD KIT</small></div>
    <div id="hdrRight">
      <div id="clock" class="mono">--:--</div>
      <button class="iconBtn" id="sndBtn" aria-label="sound">🔊</button>
    </div>
  </div>
  <div id="screen"></div>
  <div id="tabbar"></div>
</div>

<div id="flash"></div>
<div id="reboot">
  <div class="logo mono" style="font-size:18px;letter-spacing:.4em;color:var(--teal)">GHOSTLINE</div>
  <div class="mono" id="rebootMsg" style="font-size:12px;letter-spacing:.25em;color:var(--mut)">SYSTEMS REBOOTING</div>
  <div class="bar"><i id="rebootBar" style="width:0%"></i></div>
</div>
<div id="sdOverlay">
  <div class="mono" style="letter-spacing:.4em;color:var(--red);font-size:13px">⚠ SELF-DESTRUCT ARMED ⚠</div>
  <div id="sdCount" class="mono">10</div>
  <div class="mono" id="sdMsg" style="font-size:11px;letter-spacing:.25em;color:var(--mut)">EVACUATE THE AREA</div>
  <button class="btn red" id="sdAbort" style="max-width:280px">ABORT SEQUENCE</button>
</div>
<div id="toasts"></div>

<script>
"use strict";
/* =====================================================================
   GHOSTLINE // UMBRA-7 — fictional field-kit theater. All data simulated.
   ===================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS="spydev.";
const store={
  get(k,d){try{const v=localStorage.getItem(LS+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
};
/* ---------------- AUDIO ENGINE (100% procedural Web Audio) ---------------- */
const AU={ctx:null,on:true,humNodes:null,
init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}},
resume(){if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume()},
now(){return this.ctx?this.ctx.currentTime:0},
env(g,t,a,peak,dur){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);},
tone(f,dur,type,vol,slideTo,delay){if(!this.ctx||!this.on)return;const t=this.now()+(delay||0);
  const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  this.env(g,t,0.008,vol||.12,dur);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+dur+.05);
  return()=>{try{o.stop()}catch(e){}};},
_blipT:0,_tickT:0,
blip(f){const n=Date.now();if(n-this._blipT<250)return;this._blipT=n;this.tone(f||880,.09,"sine",.08)},
confirm(){this.tone(660,.1,"sine",.1);this.tone(990,.14,"sine",.1,null,.09)},
error(){this.tone(220,.2,"square",.07);this.tone(160,.25,"square",.07,null,.12)},
tick(){const n=Date.now();if(n-this._tickT<250)return;this._tickT=n;this.tone(1200,.04,"square",.04)},
scanRise(dur){if(!this.ctx||!this.on)return;const t=this.now();
  const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type="sine";
  o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(2400,t+dur);
  this.env(g,t,.05,.1,dur);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+dur+.05);
  return()=>{try{o.stop()}catch(e){}};},
encryptBurst(){if(!this.ctx||!this.on)return;for(let i=0;i<8;i++)this.tone(400+Math.random()*1600,.05,"square",.035,null,i*.045)},
boom(){if(!this.ctx||!this.on)return;const t=this.now();
  const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type="sine";
  o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(28,t+.9);
  this.env(g,t,.01,.5,1.1);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+1.2);
  const len=this.ctx.sampleRate*.5,buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=buf.getChannelData(0);

  return "rgb("+Math.round(a[0]+(b[0]-a[0])*f)+","+Math.round(a[1]+(b[1]-a[1])*f)+","+Math.round(a[2]+(b[2]-a[2])*f)+")";}

  if(feedRAF)return;
  const cvs=$$("#feeds canvas"),ctxs=cvs.map(cv=>cv.getContext("2d")),W=340,H=150;
  const scenes=cvs.map((cv,i)=>({
    figs:Array.from({length:3},()=>({x:Math.random()*W,y:100+Math.random()*26,v:.22+Math.random()*.55,s:.8+Math.random()*.45,ph:Math.random()*7})),
    cars:Array.from({length:5},()=>({x:Math.random()*W,lane:Math.random()<.5?0:1,sp:1.6+Math.random()*2.6})),
    winLit:Array.from({length:30},()=>Math.random()<.55),
    ts:"",tsT:0}));
  let lastT=0;
  function draw(ts){feedRAF=requestAnimationFrame(draw);
    const now=(typeof ts==="number")?ts:Date.now();
    const dt=lastT?Math.min(.1,(now-lastT)/1000):1/60;lastT=now;feedT+=dt;
    const thermal=document.body.classList.contains("thermal");
    const night=document.body.classList.contains("nightvis");
    cvs.forEach((cv,i)=>{const g=ctxs[i],sc=scenes[i];
      /* sky */
      const gr=g.createLinearGradient(0,0,0,H);
      if(thermal){gr.addColorStop(0,heat(.03));gr.addColorStop(1,heat(.09));}
      else if(night){gr.addColorStop(0,"#05080e");gr.addColorStop(1,"#0a0f16");}
      else{gr.addColorStop(0,"#0c1420");gr.addColorStop(1,"#141d29");}
      g.fillStyle=gr;g.fillRect(0,0,W,H);
      /* rooftop skyline: two drifting layers with lit windows */
      for(let l=0;l<2;l++){
        const baseY=H-44-l*24,off=(feedT*(7+l*8)+i*173)%92;
        for(let k=-1;k<9;k++){
          const bx=k*46-off+((i*31+l*17)%23),bh=24+(((k*37+i*13+l*7)%30+30)%30);
          g.fillStyle=thermal?heat(.10+l*.05):(night?"#0b1119":"#101823");
          g.fillRect(bx,baseY-bh,40,bh);
          for(let wy=0;wy<3;wy++)for(let wx=0;wx<3;wx++){
            const lit=sc.winLit[(((k*9+wy*3+wx+l*5+i*3)%30)+30)%30];
            g.fillStyle=thermal?(lit?heat(.55):heat(.18)):
              (lit?(night?"rgba(160,220,190,.5)":"rgba(255,205,120,.55)"):"rgba(255,255,255,.06)");
            g.fillRect(bx+6+wx*11,baseY-bh+6+wy*8,5,4);
          }
        }
      }
      /* road with vehicle light streaks */
      const roadY=H-28;
      g.fillStyle=thermal?heat(.14):"#070a0f";g.fillRect(0,roadY,W,H-roadY);
      g.fillStyle=thermal?heat(.3):"rgba(0,230,195,.14)";g.fillRect(0,roadY,W,1);
      sc.cars.forEach(c=>{c.x+=c.sp*dt*26*(c.lane?-1:1);
        if(c.x>W+34)c.x=-34;if(c.x<-34)c.x=W+34;
        const y=roadY+7+c.lane*11;
        if(thermal){g.fillStyle=heat(.92);g.fillRect(c.x-15,y,30,3);}
        else{g.fillStyle="rgba(8,12,17,.95)";g.fillRect(c.x-7,y-5,14,6);
          g.fillStyle=c.lane?"rgba(255,90,90,.95)":"rgba(255,244,210,.95)";
          g.fillRect(c.x+(c.lane?-9:7),y-2,4,3);g.fillRect(c.x+(c.lane?5:-11),y-2,4,3);}
      });
      /* walking figures — humanoid, not boxes */
      sc.figs.forEach(f=>{f.x+=f.v*dt*34;if(f.x>W+18){f.x=-18;f.y=100+Math.random()*26;}
        const x=f.x,y=f.y,s=f.s,ph=f.ph+feedT*5.2;
        const col=thermal?heat(.8):(night?"rgba(190,230,205,.85)":"rgba(200,220,235,.85)");
        g.fillStyle=col;
        g.beginPath();g.arc(x,y-15*s,3.6*s,0,7);g.fill(); /* head */
        g.beginPath(); /* tapered torso */
        g.moveTo(x-4.4*s,y-11*s);g.lineTo(x+4.4*s,y-11*s);
        g.lineTo(x+3*s,y+3*s);g.lineTo(x-3*s,y+3*s);g.closePath();g.fill();
        g.strokeStyle=col;g.lineCap="round";g.lineWidth=2.8*s;
        const s1=Math.sin(ph)*3.4*s,s2=Math.sin(ph+Math.PI)*3.4*s;
        g.beginPath();g.moveTo(x-1.6*s,y+3*s);g.lineTo(x-1.6*s+s1,y+13*s);g.stroke();
        g.beginPath();g.moveTo(x+1.6*s,y+3*s);g.lineTo(x+1.6*s+s2,y+13*s);g.stroke();
        g.lineWidth=2.1*s;
        g.beginPath();g.moveTo(x-3.6*s,y-9*s);g.lineTo(x-4.6*s+s2*.6,y+1*s);g.stroke();
        g.beginPath();g.moveTo(x+3.6*s,y-9*s);g.lineTo(x+4.6*s+s1*.6,y+1*s);g.stroke();
      });
      /* faint dust — subtle, not a grain storm; no scanlines */
      g.fillStyle=thermal?"rgba(255,255,255,.05)":"rgba(255,255,255,.035)";
      for(let n=0;n<22;n++)g.fillRect(Math.random()*W,Math.random()*H,1,1);
      /* tracking reticle */
      const f0=FEEDS[i];
      if(f0.locked){const t0=sc.figs[0],cx=t0.x,cy=t0.y-4;
        g.strokeStyle="#ff3b4e";g.lineWidth=1.5;
        const r=24+Math.sin(feedT*5)*3;
        g.beginPath();g.arc(cx,cy,r,0,7);g.stroke();
        g.beginPath();g.moveTo(cx-r-8,cy);g.lineTo(cx-r+6,cy);g.moveTo(cx+r-6,cy);g.lineTo(cx+r+8,cy);
        g.moveTo(cx,cy-r-8);g.lineTo(cx,cy-r+6);g.moveTo(cx,cy+r-6);g.lineTo(cx,cy+r+8);g.stroke();
        g.fillStyle="#ff3b4e";g.font="10px monospace";g.fillText("TRACKING",cx-r,cy-r-10);}
      else{g.strokeStyle="rgba(0,230,195,.5)";g.lineWidth=1;
        g.strokeRect(W/2-20,H/2-20,40,40);
        g.beginPath();g.moveTo(W/2-28,H/2);g.lineTo(W/2-14,H/2);g.moveTo(W/2+14,H/2);g.lineTo(W/2+28,H/2);
        g.moveTo(W/2,H/2-28);g.lineTo(W/2,H/2-14);g.moveTo(W/2,H/2+14);g.lineTo(W/2,H/2+28);g.stroke();}
      /* timestamp, cached at 1 Hz */
      if(feedT-sc.tsT>1){sc.ts=new Date().toISOString().substr(11,8);sc.tsT=feedT;}
      g.fillStyle=thermal?"rgba(255,255,255,.75)":"rgba(255,255,255,.6)";g.font="9px monospace";
      g.fillText(sc.ts+" // SIM",8,H-8);
    });}
  draw();
}

/* --- LASER GRID minigame (rAF gated to the gadgets tab via laserStart/laserStop) --- */
function initLaser(){
  const cv=$("#laserCv"),g=cv.getContext("2d");
  let nodes=[],round=0,target=-1,timeLeft=0,playing=false,raf=null,t=0,lastT=0;
  function reset(){nodes=Array.from({length:6},()=>({x:40+Math.random()*260,y:40+Math.random()*180,
    vx:(Math.random()-.5)*2.4,vy:(Math.random()-.5)*2.4}));}
  function draw(ts){raf=requestAnimationFrame(draw);
    const now=(typeof ts==="number")?ts:Date.now(); /* timestamp-delta: frame-rate independent */
    const dt=lastT?Math.min(.1,(now-lastT)/1000):1/60;lastT=now;t+=dt;
    g.clearRect(0,0,340,260);
    /* laser lines */
    g.strokeStyle="rgba(255,59,78,.25)";g.lineWidth=1;
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      g.beginPath();g.moveTo(nodes[i].x,nodes[i].y);g.lineTo(nodes[j].x,nodes[j].y);g.stroke();}
    nodes.forEach((n,i)=>{n.x+=n.vx*dt*60;n.y+=n.vy*dt*60;
      if(n.x<16||n.x>324)n.vx*=-1;if(n.y<16||n.y>244)n.vy*=-1;
      const armed=i===target;
      g.fillStyle=armed?"#ff3b4e":(playing?"rgba(0,230,195,.7)":"rgba(124,135,148,.5)");
      g.beginPath();g.arc(n.x,n.y,armed?13+Math.sin(t*10)*3:10,0,7);g.fill();
      if(armed){g.strokeStyle="#fff";g.lineWidth=2;g.beginPath();g.arc(n.x,n.y,18,0,7);g.stroke();}});
    if(playing){timeLeft-=dt;
      g.fillStyle="#fff";g.font="11px monospace";
      g.fillText("ROUND "+(round+1)+"/5   "+Math.max(0,timeLeft).toFixed(1)+"s",12,18);
      if(timeLeft<=0)lose();}}
  function nextRound(){round++;if(round>5){win();return}
    target=Math.floor(Math.random()*nodes.length);timeLeft=Math.max(1.6,3.4-round*.4);
    $("#laserMsg").textContent="ROUND "+round+" OF 5 — TAP THE RED NODE";AU.blip(700+round*80);}
  function win(){playing=false;cancelAnimationFrame(raf);raf=null;
    $("#laserMsg").textContent="✓ GRID BYPASSED";$("#laserMsg").style.color="var(--grn)";
    AU.sting();updStat("laserWins");addXP(30);
    toast("🔷 BYPASS COMPLETE","Laser grid neutralized. +30 XP.");}
  function lose(){playing=false;cancelAnimationFrame(raf);raf=null;
    $("#laserMsg").textContent="✗ ALARM TRIPPED — TRY AGAIN";$("#laserMsg").style.color="var(--red)";
    AU.error();}
  cv.addEventListener("pointerdown",e=>{if(!playing)return;
    const r=cv.getBoundingClientRect();
    const x=(e.clientX-r.left)*(340/r.width),y=(e.clientY-r.top)*(260/r.height);
    const n=nodes[target],d=Math.hypot(n.x-x,n.y-y);
    if(d<30){AU.confirm();nextRound();}else{AU.error();timeLeft-=.5;}});
  $("#laserStart").onclick=()=>{reset();round=0;playing=true;lastT=0;
    $("#laserMsg").style.color="var(--mut)";
    if(raf){cancelAnimationFrame(raf);raf=null}
    nextRound();draw();};
  reset();
  laserStart=()=>{if(raf)return;lastT=0;draw();};
  laserStop=()=>{if(raf){cancelAnimationFrame(raf);raf=null}};
  laserRAFState=()=>raf;
}

    const n=Math.round(p/5);d.innerHTML=label+" ["+"█".repeat(n)+"░".repeat(20-n)+"] "+Math.round(p)+"%";
    if(Math.random()<.4)AU.tick();out.scrollTop=out.scrollHeight;},110);});}
let termBusy=false;
const termCd={}; /* per-command XP cooldowns — no infinite farming */
function termGate(cmd,secs){const n=Date.now();
  if(termCd[cmd]&&n-termCd[cmd]<secs*1000){
    termPrint("<span class='w'>UPLINK RECHARGING</span> — "+cmd+" needs "+
      Math.ceil((secs*1000-(n-termCd[cmd]))/1000)+"s to cool down.","w");
    AU.error();return false;}
  termCd[cmd]=n;return true;}
async function termCmd(raw){
  if(termBusy){termPrint("<span class='e'>LINK BUSY</span> — one operation at a time, operative.","e");AU.error();return;}
  termBusy=true;
  try{
  termPrint("<span class='p'>ghost@umbra7</span>:~$ "+raw.replace(/</g,"&lt;"));
  const[cmd,...args]=raw.toLowerCase().split(/\s+/);
  const tgt=(args[0]||"node-7").toUpperCase();
  switch(cmd){
   case "help":termPrint("COMMANDS:","w");
    termPrint("  <span class='p'>breach [target]</span> — infiltrate a node");
    termPrint("  <span class='p'>trace</span> — trace a hostile signal");
    termPrint("  <span class='p'>decrypt</span> — crack an intercepted file");
    termPrint("  <span class='p'>scan</span> — sweep local network");
    termPrint("  <span class='p'>whoami / status / clear</span>");break;
   case "breach":if(!termGate("breach",60))break;
    termPrint("Targeting <span class='w'>"+tgt+"</span> …","w");
    await termProgress("injecting payload");await termProgress("escalating privileges");
    await termProgress("exfiltrating");termPrint("✓ BREACH COMPLETE — 2.4MB exfiltrated (simulated).","p");
    AU.sting();updStat("hacks");addXP(20);break;
   case "trace":if(!termGate("trace",60))break;
    termPrint("Triangulating hostile signal…","w");
    await termProgress("hop 1 — relay mask");await termProgress("hop 2 — sat bounce");
    await termProgress("hop 3 — origin lock");termPrint("✓ SIGNAL ORIGIN: <span class='e'>dock sector, pier 9</span> (simulated).","p");
    AU.confirm();updStat("hacks");addXP(15);break;
   case "decrypt":if(!termGate("decrypt",60))break;
    await termProgress("brute-forcing cipher");
    termPrint("✓ FILE DECRYPTED: <span class='c'>“the ferryman moves at dawn”</span> (simulated).","p");
    AU.confirm();updStat("hacks");addXP(15);break;
   case "scan":await termProgress("sweeping subnet");
    termPrint("6 nodes found. 2 vulnerable. 0 friendly. (simulated)","w");AU.blip(700);break;
   case "whoami":termPrint("operative <span class='p'>"+S.codename+"</span> — clearance "+rank()[0],"p");break;
   case "status":termPrint("uptime 99.98% · uplink LOCKED · traces PURGED · cover INTACT","c");break;
   case "override":termPrint("Nice try. Override requires CONTROL authorization.","e");AU.error();break;
   case "selfdestruct":termPrint("Denied. Use the big red button like everyone else.","e");AU.error();break;
   case "hello":termPrint("The night is quiet. Too quiet.","d");break;
   case "open sesame":termPrint("The vault was empty. It always is.","d");break;
   case "clear":$("#termOut").innerHTML="";break;
   default:termPrint("unknown command: <span class='e'>"+cmd.replace(/</g,"&lt;")+"</span> — try <span class='p'>help</span>","e");AU.error();
  }
  }finally{termBusy=false;}
}
/* --- CODE BREAKER (Simon) --- */
function initCode(){
  const names=["ALPHA","BRAVO","CHARLIE","DELTA"],freqs=[330,415,494,587];
  let seq=[],pos=0,round=0,accept=false,seqToken=0; /* token cancels stale playSeq on re-tap */
  const pads=$("#codePads");
  names.forEach((n,i)=>{const b=document.createElement("button");b.className="pad";b.textContent=n;
    b.onclick=()=>press(i);pads.appendChild(b);});
  const msg=$("#codeMsg"),btns=[...pads.children];
  function lit(i,dur){return new Promise(r=>{btns[i].classList.add("lit");AU.tone(freqs[i],.28,"triangle",.12);
    setTimeout(()=>{btns[i].classList.remove("lit");setTimeout(r,90)},dur||320)});}
  async function playSeq(my){accept=false;msg.textContent="WATCH…";msg.style.color="var(--cyan)";
    await new Promise(r=>setTimeout(r,700));
    for(const s of seq){if(my!==seqToken)return;await lit(s);}
    if(my!==seqToken)return;
    pos=0;accept=true;msg.textContent="YOUR TURN — REPEAT "+seq.length;msg.style.color="var(--teal)";}
  async function press(i){if(!accept)return;const my=seqToken;await lit(i,180);
    if(my!==seqToken)return;
    if(i===seq[pos]){pos++;
      if(pos===seq.length){round++;accept=false;
        if(round>=4){win();}else{seq.push(Math.floor(Math.random()*4));
          msg.textContent="✓ ROUND "+round+" — EXTENDING";AU.confirm();
          setTimeout(()=>{if(my===seqToken)playSeq(my)},900);}}}
    else{accept=false;msg.textContent="✗ SEQUENCE BROKEN — RETRY";msg.style.color="var(--red)";
      AU.error();setTimeout(()=>{if(my!==seqToken)return;round=0;seq=[];msg.textContent="PRESS START";},1600);}}
  function win(){msg.textContent="✓ VAULT CRACKED";msg.style.color="var(--grn)";
    AU.sting();updStat("codeWins");addXP(50);
    const files=store.get("classified",[]);
    if(!files.some(f=>f.t==="FILE 7 — FERRYMAN")){files.push({t:"FILE 7 — FERRYMAN",d:"unlocked "+new Date().toLocaleDateString()});store.set("classified",files);}
    toast("🔓 CLASSIFIED FILE UNLOCKED","FILE 7 — FERRYMAN added to your dossier.");}
  $("#codeStart").onclick=()=>{seqToken++;const my=seqToken;
    seq=[Math.floor(Math.random()*4)];round=1;AU.blip(600);playSeq(my);};
}

const MISSIONS=[
 {id:"m1",name:"FIRST CONTACT",desc:"Establish the handler channel.",
  objs:[["Decrypt 3 handler messages",()=>S.stats.decrypted>=3],["Send an encrypted reply",()=>S.stats.replies>=1]],xp:40},
 {id:"m2",name:"GHOST CIRCUIT",desc:"Prove your fieldcraft in the digital arena.",
  objs:[["Win CODE BREAKER (terminal)",()=>S.stats.codeWins>=1],["Bypass the laser grid (gadgets)",()=>S.stats.laserWins>=1]],xp:60},
 {id:"m3",name:"EYES ON",desc:"Build the target picture.",
  objs:[["Designate a priority target (tracker)",()=>S.stats.designations>=1],["Lock a tracking reticle (cams)",()=>S.stats.locks>=1]],xp:50},
];
function buildOps(){
  let el=$("#tab-ops");if(!el)el=mkTab("ops","");
  el.innerHTML="<div id='opsDossier'></div><div id='opsMissions'></div>";
  renderOps();
}
function renderOps(){
  const el=$("#opsMissions");if(!el)return;
  let h="<div class='panel'><div class='ptitle'>ACTIVE OPERATIONS</div>";
  MISSIONS.forEach(m=>{
    const complete=!!S.missions[m.id];
    h+="<div class='panel mission"+(complete?" done":"")+"' style='margin-bottom:10px'>"+
     "<div class='ptitle' style='color:"+(complete?"var(--grn)":"var(--cyan)")+"'>"+(complete?"✓ ":"")+m.name+"</div>"+
     "<div class='hint' style='margin:0 0 6px'>"+m.desc+" — reward "+m.xp+" XP</div>"+
     m.objs.map(o=>"<div class='obj"+(o[1]()?" hit":"")+"'><div class='box'>"+(o[1]()?"✓":"")+"</div>"+o[0]+"</div>").join("")+
     "</div>";});
  h+="</div><div class='hint'>Objectives complete automatically as you use the kit. Finished missions bank XP toward your next clearance rank.</div>";
  el.innerHTML=h;
}
/* completions are evaluated on every objective state-change (via updStat),
   regardless of which tab is visible — the payoff is never deferred */
function checkMissions(){
  let hit=false;
  MISSIONS.forEach(m=>{if(S.missions[m.id])return;
    if(m.objs.every(o=>o[1]())){S.missions[m.id]=true;hit=true;
      S.stats.missions=(S.stats.missions||0)+1;addXP(m.xp);
      setTimeout(()=>{AU.sting();toast("🎯 MISSION COMPLETE",m.name+" — +"+m.xp+" XP. Clearance progress banked.");},400);}});
  if(hit){store.set("missions",S.missions);saveStats();updateHeaderStats();}
  if(curTab==="ops")renderOps();
}
/* =====================================================================
   SELF-DESTRUCT (pure theater — the drill reveal lands AFTER the countdown)
   ===================================================================== */
let killBuilt=false;
function buildKill(){
  if(killBuilt)return;killBuilt=true;
  const host=$("#tab-gadgets");if(!host)return; /* final option lives in GADGETS */
  const pane=document.createElement("div");pane.innerHTML=
   "<div class='panel' id='killPane'>"+
   "<div class='ptitle' style='color:var(--red)'>⚠ FINAL OPTION ⚠</div>"+
   "<div class='hint' style='margin-bottom:4px'>DEVICE ZEROIZATION PROTOCOL<br><b style='color:var(--red)'>IRREVERSIBLE — NO RECOVERY</b></div>"+
   "<button id='killBtn'>HOLD<br>3 SEC<br><svg id='killRing' viewBox='0 0 190 190'><circle cx='95' cy='95' r='93' stroke='rgba(255,59,78,.15)' stroke-width='5' fill='none'/><circle id='killFg' cx='95' cy='95' r='93'/></svg></button>"+
   "<div class='hint'>PRESS AND HOLD FOR 3 SECONDS TO ARM</div></div>";
  host.appendChild(pane);
  const btn=$("#killBtn"),fg=$("#killFg"),C=584;let iv=null,sdIv=null,count=10,ktone=null;
  btn.addEventListener("touchstart",start,{passive:false});
  btn.addEventListener("touchend",cancel);btn.addEventListener("touchcancel",cancel);
  btn.addEventListener("mousedown",start);btn.addEventListener("mouseup",cancel);
  const stopKTone=()=>{if(ktone){try{ktone()}catch(e){}ktone=null}};
  function start(e){e.preventDefault();AU.resume();let p=0;
    if(iv){clearInterval(iv);iv=null}stopKTone(); /* re-tap guard: never stack arms */
    ktone=AU.tone(150,3,"sawtooth",.08,600);
    iv=setInterval(()=>{p+=100/50;fg.style.strokeDashoffset=C*(1-Math.min(1,p/100));
      if(p>=100){clearInterval(iv);iv=null;armSD();}},60);}
  function cancel(){stopKTone();
    if(iv){clearInterval(iv);iv=null;fg.style.strokeDashoffset=C;AU.error();}}
  function armSD(){const o=$("#sdOverlay");o.style.display="flex";o.classList.add("alarm");
    if(sdIv)clearInterval(sdIv);
    count=10;$("#sdCount").textContent=count;
    $("#sdMsg").textContent="EVACUATE THE AREA";
    AU.alarm();
    sdIv=setInterval(()=>{count--;$("#sdCount").textContent=count;
      if(count<=0){clearInterval(sdIv);sdIv=null;drillDone();}},1000);}
  $("#sdAbort").onclick=()=>{if(sdIv){clearInterval(sdIv);sdIv=null}AU.confirm();
    $("#sdOverlay").style.display="none";$("#sdOverlay").classList.remove("alarm");
    fg.style.strokeDashoffset=C;toast("🛑 SEQUENCE ABORTED","Zeroization cancelled. Device intact.");};
  function drillDone(){const o=$("#sdOverlay");o.classList.remove("alarm");
    $("#sdCount").textContent="✓";$("#sdCount").style.fontSize="64px";$("#sdCount").style.color="var(--grn)";
    $("#sdMsg").innerHTML="DRILL COMPLETE — THIS WAS A TEST.<br>NO DATA WAS HARMED. NICE NERVES, "+S.codename+".";
    $("#sdAbort").textContent="STAND DOWN";
    AU.sting();addXP(10);
    setTimeout(()=>{o.style.display="none";
      $("#sdCount").textContent="10";$("#sdCount").style.fontSize="96px";$("#sdCount").style.color="var(--red)";
      $("#sdAbort").textContent="ABORT SEQUENCE";fg.style.strokeDashoffset=C;
      toast("🎖 DRILL LOGGED","Self-destruct drill completed. +10 XP for nerve.");},4500);}
}
