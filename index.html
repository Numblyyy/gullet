<title>GULLET</title>
<style>
/* GULLET — single-file PWA. All UI is canvas-drawn; this CSS only kills
   browser chrome behaviors (zoom, scroll, selection, callout). */
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#140a08;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="./gullet-a.js"></script>
<script src="./gullet-b.js"></script>
</body>
